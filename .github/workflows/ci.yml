name: Nginx CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  nginx-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check Nginx port
        run: |
          grep -q "listen 80;" nginx/default.conf
          echo "Nginx port configuration is valid"

      - name: Check health endpoint
        run: |
          grep -q "/health" nginx/default.conf
          echo "Health endpoint is configured"
